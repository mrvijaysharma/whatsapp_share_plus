group = "com.vijay_sharma.whatsapp_share_plus"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.vijay_sharma.whatsapp_share_plus"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        // Android 5.0. WhatsApp itself requires a higher version than this, so
        // the floor is set by what the plugin can compile against rather than
        // by what can realistically run it.
        minSdk = 21
    }

    dependencies {
        // kotlin-test-junit5 (rather than plain kotlin-test) so that the
        // `kotlin.test.Test` annotation maps onto the JUnit Platform runner
        // configured below. With the default JUnit 4 flavour the tests compile
        // but are silently never executed.
        testImplementation("org.jetbrains.kotlin:kotlin-test-junit5")
        testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.11.4")
        testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}
