name: whatsapp_share_plus
description: A Flutter plugin to share text and images directly to WhatsApp and WhatsApp Business on Android and iOS. Supports sharing to specific contacts via phone number.
version: 1.0.3
homepage: https://github.com/mrvijaysharma/whatsapp_share_plus
repository: https://github.com/mrvijaysharma/whatsapp_share_plus
issue_tracker: https://github.com/mrvijaysharma/whatsapp_share_plus/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.vijay_sharma.whatsapp_share_plus
        pluginClass: WhatsappSharePlusPlugin
      ios:
        pluginClass: WhatsappSharePlusPlugin
