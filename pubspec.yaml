name: whatsapp_share_plus
description: Share text, images, video and documents to WhatsApp and WhatsApp Business. Target a contact by phone number, send multiple files, and install sticker packs.
version: 2.0.0
homepage: https://github.com/mrvijaysharma/whatsapp_share_plus
repository: https://github.com/mrvijaysharma/whatsapp_share_plus
issue_tracker: https://github.com/mrvijaysharma/whatsapp_share_plus/issues
documentation: https://github.com/mrvijaysharma/whatsapp_share_plus#readme

topics:
  - whatsapp
  - share
  - sharing
  - deep-links
  - stickers

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  cross_file: ^0.3.4
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.vijay_sharma.whatsapp_share_plus
        pluginClass: WhatsappSharePlusPlugin
      ios:
        pluginClass: WhatsappSharePlusPlugin
      macos:
        pluginClass: WhatsappSharePlusPlugin
      linux:
        pluginClass: WhatsappSharePlusPlugin
      windows:
        pluginClass: WhatsappSharePlusPluginCApi
      web:
        pluginClass: WhatsappSharePlusWeb
        fileName: whatsapp_share_plus_web.dart
